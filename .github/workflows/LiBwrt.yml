name: LiBwrt编译 JDCloud 雅典娜(RE-CS-02) 固件

# 仅手动触发，无任何自动触发
on:
  workflow_dispatch:

jobs:
  build:
    # ✅ 官方推荐 Ubuntu 20.04，最稳定
    runs-on: ubuntu-20.04

    steps:
      - name: 清理 Runner 冗余文件释放磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: 检出当前仓库配置
        uses: actions/checkout@v4

      - name: 设置时区为上海
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 安装 OpenWrt 编译依赖（官方推荐清单）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex g++ gawk gcc-multilib git \
            libncurses5-dev libssl-dev libelf-dev rsync unzip zlib1g-dev \
            python3 python3-distutils python3-setuptools python3-pip \
            bc quilt

      - name: 克隆 LiBwrt openwrt-6.x 源码
        run: |
          # ✅ 关键修复：强制删除旧目录，避免 clone 失败
          rm -rf libwrt
          git clone --depth 1 --single-branch https://github.com/LiBwrt/openwrt-6.x.git libwrt

      - name: 复制自定义编译配置
        run: |
          cp diy-part1.sh libwrt/
          cp diy-part2.sh libwrt/
          cp feeds.conf.default libwrt/
          cp info.config libwrt/.config
          chmod +x libwrt/diy-part1.sh libwrt/diy-part2.sh

      - name: 执行 DIY 自定义脚本
        working-directory: ./libwrt
        run: |
          ./diy-part1.sh
          ./diy-part2.sh

      - name: 更新并安装 Feeds
        working-directory: ./libwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 下载 DL 库
        working-directory: ./libwrt
        run: make download -j$(nproc)

      - name: 编译 JDCloud RE-CS-02 固件
        working-directory: ./libwrt
        run: |
          # ✅ 官方明确建议：为便于排查错误，推荐单线程
          # IPQ60xx + NSS 编译非常吃内存，GitHub Runner 7G 内存必须用 -j1
          make -j1 V=s

      - name: 上传编译完成的固件
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud_RE-CS-02_雅典娜固件
          path: libwrt/bin/targets/qualcommax/ipq60xx/
