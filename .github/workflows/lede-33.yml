name: LEDE 手动固件编译【融合优化版】指定哈希值带docker
on:
  workflow_dispatch:
    inputs:
      TARGET_PROFILE:
        description: 编译机型名称
        required: true
        default: jdc_ax6600
      COMPILE_THREAD:
        description: 编译线程数
        required: true
        default: "4"
      SAVE_LOG:
        description: 是否保存完整编译日志
        type: boolean
        default: true

jobs:
  build_firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: 磁盘空间最大化
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 1.拉取仓库全部文件
        uses: actions/checkout@v4

      - name: 磁盘空间检查
        run: df -hT

      - name: 2.安装Ubuntu编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget unzip libssl-dev python3 python3-pip time rsync curl
          sudo apt autoremove -y
          sudo apt clean

      - name: 3.克隆 coolsnowwolf/lede
        run: |
          git clone https://github.com/coolsnowwolf/lede.git openwrt
          cd openwrt
          git pull

      - name: 4.覆盖自定义 feeds.conf.default
        run: cp -v ./lede/feeds.conf.default ./openwrt/feeds.conf.default

      - name: 5.执行 diy‑part1.sh
        run: |
          chmod +x ../lede/diy-part1.sh
          ../lede/diy-part1.sh
        working-directory: ./openwrt

      # 【关键修复】替换官方Dockerman + 修正目录结构 + APK版本号适配
      - name: 替换为第三方完整版 Dockerman (修复目录结构+APK适配)
        run: |
          cd openwrt
          # 1. 彻底清理所有同名包，杜绝双版本冲突
          rm -rf feeds/luci/applications/luci-app-dockerman
          rm -rf feeds/luci/collections/luci-lib-docker
          rm -rf feeds/packages/utils/luci-lib-docker
          rm -rf package/luci-app-dockerman package/luci-lib-docker
          # 2. 克隆到临时目录
          git clone --depth=1 https://github.com/lisaac/luci-lib-docker.git tmp-lib-docker
          git clone --depth=1 https://github.com/lisaac/luci-app-dockerman.git tmp-app-dockerman
          # 3. 提取实际包目录到 package 根层级（Makefile 移到顶层，编译系统才能识别）
          mv tmp-lib-docker/collections/luci-lib-docker package/luci-lib-docker
          mv tmp-app-dockerman/applications/luci-app-dockerman package/luci-app-dockerman
          # 4. 清理临时目录
          rm -rf tmp-lib-docker tmp-app-dockerman
          # 5. 移除版本号v前缀，适配APK包格式强制校验
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-lib-docker/Makefile
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-app-dockerman/Makefile

          echo "第三方 Dockerman 替换完成，目录结构与APK格式已适配"

      - name: 6.更新安装feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        working-directory: ./openwrt

      - name: 7.导入 .config
        run: cp -v ./lede/info.config ./openwrt/.config

      - name: 8.执行 diy‑part2.sh
        run: |
          chmod +x ../lede/diy-part2.sh
          ../lede/diy-part2.sh
        working-directory: ./openwrt

      - name: 9.预编译生成完整配置
        run: make defconfig
        working-directory: ./openwrt

      - name: 10.下载编译依赖源码包
        run: make download -j${{ github.event.inputs.COMPILE_THREAD }}
        working-directory: ./openwrt

      - name: 11.编译【高线程失败自动降级单线程】
        id: compile_task
        run: |
          set -o pipefail
          COMPILE_THREAD=${{ github.event.inputs.COMPILE_THREAD }}
          echo "==== 使用线程 $COMPILE_THREAD 开始编译 ===="
          make -j${COMPILE_THREAD} 2>&1 | tee compile_log.txt
          ret_code=$?

          if [[ ${ret_code} -ne 0 ]] || grep -q "ERROR:" compile_log.txt ;then
              echo "==================== 检测编译出错，降级单线程 V=s 重试 ===================="
              make -j1 V=s 2>&1 | tee -a compile_log.txt
              ret_code=$?
          fi
          exit ${ret_code}
        working-directory: ./openwrt

      - name: 12.打包日志
        if: ${{ github.event.inputs.SAVE_LOG == true || failure() }}
        run: tar -zcvf compile_log.tar.gz ./openwrt/compile_log.txt

      - name: 13.上传编译日志
        if: ${{ github.event.inputs.SAVE_LOG == true || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LEDE_编译完整日志
          path: compile_log.tar.gz
          retention-days: 7

      - name: 固件目录校验
        if: success()
        run: ls -l openwrt/bin/targets/qualcommax/ipq60xx/

      - name: 上传 factory 全新刷机固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LEDE_JDC_AX6600_factory
          path: openwrt/bin/targets/qualcommax/ipq60xx/*factory.bin
          retention-days: 15

      - name: 上传 sysupgrade 升级固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LEDE_JDC_AX6600_sysupgrade
          path: openwrt/bin/targets/qualcommax/ipq60xx/*sysupgrade.bin
          retention-days: 15
