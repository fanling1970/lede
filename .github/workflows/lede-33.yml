name: Lede最新优化不指定哈希值
on:
  workflow_dispatch:
    inputs:
      COMPILE_THREAD:
        description: "编译线程数"
        required: true
        default: "4"

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: 最大化磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: 检出仓库
        uses: actions/checkout@main

      - name: 2.安装Ubuntu编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget unzip libssl-dev python3 python3-pip time rsync curl libelf-dev zlib1g-dev pkg-config ccache
          sudo apt autoremove -y
          sudo apt clean

      - name: 拉取Lede源码
        run: |
          git clone https://github.com/coolsnowwolf/lede.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 复制配置与脚本
        run: |
          cp -f .config openwrt/.config
          cp -f diy-part1.sh openwrt/diy-part1.sh
          cp -f diy-part2.sh openwrt/diy-part2.sh
          chmod +x openwrt/diy-part1.sh openwrt/diy-part2.sh
          cd openwrt
          ./diy-part1.sh
          ./diy-part2.sh

      # Lede 使用源码自带官方 dockerman，不引入第三方，故此处无dockerman替换步骤

      - name: 3.开始编译固件
        run: |
          cd openwrt
          COMPILE_THREAD=${{ github.event.inputs.COMPILE_THREAD }}
          echo "==== 使用线程 $COMPILE_THREAD 开始编译 ===="
          make -j${COMPILE_THREAD} 2>&1 | tee compile_log.txt
          ret_code=${PIPESTATUS[0]}

          if [[ ${ret_code} -ne 0 ]] || grep -q "ERROR:" compile_log.txt ;then
            echo "==================== 检测编译出错，降级单线程 V=s 重试 ===================="
            make -j1 V=s 2>&1 | tee -a compile_log.txt
            ret_code=${PIPESTATUS[0]}

            if grep -q "toolchain/kernel-headers failed to build" compile_log.txt; then
              echo "===== 单独执行 toolchain/kernel‑headers 诊断编译 ====="
              make toolchain/kernel-headers/compile V=s -j1 2>&1 | tee -a compile_log.txt || true
            fi
          fi

          exit ${ret_code}

      - name: Dump kernel‑headers verbose log on failure
        if: failure()
        run: |
          cd openwrt || exit 0
          echo "生成kernel‑headers诊断日志"
          make toolchain/kernel-headers/compile V=s -j1 2>&1 | tee kernel_headers_diagnostic.log || true
          tar -czf kernel_headers_diagnostic.tar.gz kernel_headers_diagnostic.log

      - name: 上传完整编译日志
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Lede_编译完整日志
          path: |
            openwrt/compile_log.txt
            openwrt/kernel_headers_diagnostic.tar.gz

      - name: 上传固件工件
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Lede‑Firmware
          path: openwrt/bin/targets/**/*.bin
