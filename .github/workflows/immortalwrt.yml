# Description: Build OpenWrt using GitHub Actions
#
# updated version ref: https://github.com/dxdf/ActionsBuildOpenWRT
# 新增：Rust环境彻底清理，修复shadowsocks-rust编译报错
# 修正：全文件YAML缩进规范，消除解析错误
# 修复1：第三方Dockerman适配APK包格式，移除版本号v前缀
# 修复2：修正lisaac仓库目录结构，提取Makefile到包根目录
# 修复3：Docker防火墙开机自动生效，彻底解决容器开机无网络
# 修复4：屏蔽dockerd自动写防火墙，杜绝出现重复docker区域
#

name: immortalwrt

# 禁用自动触发，仅保留手动触发
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  FEEDS_CONF: immortalwrt/feeds.conf.default
  CONFIG_FILE: immortalwrt/info.config
  DIY_P1_SH: immortalwrt/diy-part1.sh
  DIY_P2_SH: immortalwrt/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 第一步：最大化构建空间（优先执行）
      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 清理前磁盘空间检查
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # 第二步：优化磁盘空间
      - name: 优化磁盘空间
        uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
            Python
            Git
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          homebrew_prune: "False"
          homebrew_clean: "False"
          npm_prune: "False"
          npm_clean: "False"
          os_swap: "False"

      - name: 清理后磁盘空间检查
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # 第三步：关键磁盘空间检查
      - name: 关键磁盘空间检查
        run: |
          echo "关键步骤前磁盘空间状态："
          echo "=============================================================================="
          df -hT
          echo "可用空间检查："
          AVAILABLE=$(df / --output=avail | tail -1)
          if [ $AVAILABLE -lt 10485760 ]; then
            echo "警告：磁盘可用空间不足10GB，可能影响编译"
            echo "当前可用空间：$((AVAILABLE/1024/1024))GB"
          fi
          echo "=============================================================================="

      - name: 检出代码
        uses: actions/checkout@main

      # 第四步：初始化编译环境
      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          echo "安装核心编译工具..."
          sudo -E apt-get -qq install build-essential gcc g++ make cmake git curl wget
          echo "安装OpenWrt编译依赖..."
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          bzip2 ccache cpio device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools \
          libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
          vim xmlto xxd zlib1g-dev python3-setuptools
          echo "清理不必要的包..."
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
          /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo timedatectl set-timezone "$TZ"
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          echo "编译环境初始化完成"

      - name: 克隆源码
        working-directory: ./
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 加载自定义软件源
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      # 【核心修复】清理Rust环境与缓存，彻底规避shadowsocks-rust编译报错
      - name: 清理Rust编译冲突环境与缓存
        run: |
          rustup self uninstall -y || true
          rm -rf ~/.rustup ~/.cargo
          cd openwrt
          rm -rf dl/cargo build_dir/target-aarch64_cortex-a53_musl/shadowsocks-rust*
          echo "Rust环境清理完成，已规避shadowsocks-rust编译错误"

      # 【关键修复】替换官方Dockerman + 修正目录结构 + APK版本号适配
      - name: 替换为第三方完整版 Dockerman (修复目录结构+APK适配)
        run: |
          cd openwrt
          # 1. 彻底清理所有同名包，杜绝双版本冲突
          rm -rf feeds/luci/applications/luci-app-dockerman
          rm -rf feeds/luci/collections/luci-lib-docker
          rm -rf feeds/packages/utils/luci-lib-docker
          rm -rf package/luci-app-dockerman package/luci-lib-docker

          # 2. 克隆到临时目录
          git clone --depth=1 https://github.com/lisaac/luci-lib-docker.git tmp-lib-docker
          git clone --depth=1 https://github.com/lisaac/luci-app-dockerman.git tmp-app-dockerman

          # 3. 提取实际包目录到 package 根层级
          mv tmp-lib-docker/collections/luci-lib-docker package/luci-lib-docker
          mv tmp-app-dockerman/applications/luci-app-dockerman package/luci-app-dockerman

          # 4. 清理临时目录
          rm -rf tmp-lib-docker tmp-app-dockerman

          # 5. 移除版本号v前缀，适配APK包格式强制校验
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-lib-docker/Makefile
          sed -i 's/PKG_VERSION:=v/PKG_VERSION:=/g' package/luci-app-dockerman/Makefile
          
          echo "第三方 Dockerman 替换完成，目录结构与APK格式已适配"

      - name: 更新软件源
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装软件源
        run: cd openwrt && ./scripts/feeds install -a

      # 【根源修复】编译期禁用dockerd自动添加防火墙，彻底杜绝重复
      - name: 源码级禁用dockerd自动写入防火墙
        run: |
          cd openwrt
          # 自动定位dockerd启动脚本
          DOCKERD_INIT=$(find package/feeds -name "dockerd.init" | head -1)
          if [ -n "$DOCKERD_INIT" ]; then
              # 删除所有uci操作防火墙的代码行，彻底关闭自动添加
              sed -i '/uci.*firewall/d' "$DOCKERD_INIT"
              echo "dockerd自动添加防火墙已从源码禁用"
          else
              echo "未找到dockerd.init，跳过源码修改"
          fi		

      # 【集成系统补丁】CPU温度 + Docker防火墙标准配置（全量清理防重复）
      - name: 集成自定义系统补丁与脚本
        run: |
          # 1. CPU温度读取脚本
          mkdir -p files/sbin
          echo '#!/bin/sh' > files/sbin/cpuinfo
          echo '# 适配IPQ60xx平台的CPU温度读取' >> files/sbin/cpuinfo
          echo 'TEMP_PATH="/sys/class/thermal/thermal_zone0/temp"' >> files/sbin/cpuinfo
          echo '' >> files/sbin/cpuinfo
          echo 'if [ -r "$TEMP_PATH" ]; then' >> files/sbin/cpuinfo
          echo '    raw_temp=$(cat "$TEMP_PATH")' >> files/sbin/cpuinfo
          echo '    temp_int=$(( raw_temp / 1000 ))' >> files/sbin/cpuinfo
          echo '    temp_dec=$(( (raw_temp / 100) % 10 ))' >> files/sbin/cpuinfo
          echo '    cpu_temp="${temp_int}.${temp_dec}"' >> files/sbin/cpuinfo
          echo '    echo "CPU ${cpu_temp}°C"' >> files/sbin/cpuinfo
          echo 'else' >> files/sbin/cpuinfo
          echo '    echo "CPU 0.0°C"' >> files/sbin/cpuinfo
          echo 'fi' >> files/sbin/cpuinfo
          chmod +x files/sbin/cpuinfo

          # 2. 防火墙配置脚本（首次开机全量清理后写入，保证全局唯一）
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-docker-firewall << 'EOF'
          #!/bin/sh

          # ========== 全量清理所有docker相关规则（遍历所有位置，无遗漏） ==========
          # 清理所有名为docker的区域
          i=0
          while uci -q get firewall.@zone[$i] >/dev/null; do
              if [ "$(uci -q get firewall.@zone[$i].name)" = "docker" ]; then
                  uci delete firewall.@zone[$i]
              else
                  i=$((i + 1))
              fi
          done

          # 清理所有涉及docker的转发规则
          i=0
          while uci -q get firewall.@forwarding[$i] >/dev/null; do
              src=$(uci -q get firewall.@forwarding[$i].src)
              dest=$(uci -q get firewall.@forwarding[$i].dest)
              if [ "$src" = "docker" ] || [ "$dest" = "docker" ]; then
                  uci delete firewall.@forwarding[$i]
              else
                  i=$((i + 1))
              fi
          done

          # ========== 写入标准docker防火墙配置 ==========
          uci add firewall zone
          uci set firewall.@zone[-1].name='docker'
          uci add_list firewall.@zone[-1].network='docker'
          uci set firewall.@zone[-1].input='ACCEPT'
          uci set firewall.@zone[-1].output='ACCEPT'
          uci set firewall.@zone[-1].forward='ACCEPT'
          uci set firewall.@zone[-1].masq='1'
          uci set firewall.@zone[-1].mtu_fix='1'
          uci add_list firewall.@zone[-1].device='docker0'
          uci add_list firewall.@zone[-1].device='br-+'
          uci add_list firewall.@zone[-1].device='veth+'

          # docker -> wan 转发（容器访问外网）
          uci add firewall forwarding
          uci set firewall.@forwarding[-1].src='docker'
          uci set firewall.@forwarding[-1].dest='wan'

          # lan -> docker 转发（局域网访问容器）
          uci add firewall forwarding
          uci set firewall.@forwarding[-1].src='lan'
          uci set firewall.@forwarding[-1].dest='docker'

          uci commit firewall
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-docker-firewall

          echo "自定义系统补丁集成完成"

      - name: 加载自定义配置
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 下载软件包
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 检查空间使用
        if: (!cancelled())
        run: df -hT

      - name: 上传bin目录
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: immortalwrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: 整理文件
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件目录
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: immortalwrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 上传固件到CowTransfer
        id: cowtransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
          echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
          echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

      - name: 上传固件到WeTransfer
        id: wetransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
          echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
          echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

      - name: 生成发布标签
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
          [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件到Releases
        uses: softprops/action-gh-release@v1
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: 删除旧的Workflow记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 3

      - name: 删除旧版本Releases
        uses: dev-drprasad/delete-older-releases@v0.1.0
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
