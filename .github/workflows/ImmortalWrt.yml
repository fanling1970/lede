name: immortalwrt

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  FEEDS_CONF: immortalwrt/feeds.conf.default
  CONFIG_FILE: immortalwrt/info.config
  DIY_P1_SH: immortalwrt/diy-part1.sh
  DIY_P2_SH: immortalwrt/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ==========================================
    # 1. 极限磁盘清理 (最激进模式)
    # ==========================================
    - name: 清理宿主机空间
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: false # 保留 Python 和 Git 工具，否则后续命令会报错
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 再次清理 apt 缓存
      run: |
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    # ==========================================
    # 2. 增加磁盘监控 (诊断关键)
    # ==========================================
    - name: 检查初始磁盘空间
      run: df -hT

    # ==========================================
    # 3. 初始化环境 (带日志限制)
    # ==========================================
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
        # 尝试限制底层 .NET 日志输出，防止日志撑爆磁盘
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
      run: |
        # 设置更大的超时时间，防止网络波动导致安装中断
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
        libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
        mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
        libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
        vim wget xmlto xxd zlib1g-dev
        
        # 安装完成后再次检查空间
        echo "安装完依赖后的空间:"
        df -hT

    # ==========================================
    # 4. 源码克隆与配置
    # ==========================================
    - name: 克隆源码
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 加载自定义 feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # ==========================================
    # 5. 下载包与编译 (保守线程策略)
    # ==========================================
    - name: 下载包
      id: package
      run: |
        cd openwrt
        make defconfig
        # 限制下载线程为 4，防止并发过高导致磁盘 IO 阻塞或临时文件过多
        make download -j4
        # 清理小于 1k 的无效文件
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        # 使用 CPU 核心数的一半进行编译，减少内存和磁盘压力
        MAKE_JOBS=$(( $(nproc) / 2 ))
        [ $MAKE_JOBS -lt 1 ] && MAKE_JOBS=1
        echo "使用 $MAKE_JOBS 线程编译"
        
        # 首次尝试多线程，失败后回退单线程
        make -j$MAKE_JOBS || make -j1 V=s

    # ==========================================
    # 6. 结果处理
    # ==========================================
    - name: 检查最终空间
      run: df -hT

    - name: 整理文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: immortalwrt_firmware
        path: ${{ env.FIRMWARE }}
